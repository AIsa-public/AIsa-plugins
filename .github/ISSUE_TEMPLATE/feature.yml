name: Feature / change proposal
description: Propose a new tool, plugin, host, or a change to how something works.
title: "[Proposal] "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to change. A rough shape is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - aisa-search
        - aisa-gtm
        - marketplace catalogs
        - ci / standard
        - new plugin
        - new host
        - new language
        - other
    validations:
      required: true
  - type: dropdown
    id: implement
    attributes:
      label: Will you implement it?
      options:
        - "Yes — I'll open a work item once this is agreed"
        - "No — looking for someone to pick it up"
    validations:
      required: true
