name: AIsa GTM contract-drift audit

# Live drift audit of the GTM tool contracts against the AIsa Tool Router + REST quote
# plane. Read-only, no credit spent, but it needs the AISA_API_KEY repository secret — so
# it runs on the weekly schedule and manual dispatch only. The offline suite that used to
# live here runs on every PR from ci.yml.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (default), or record — regenerate contracts_baseline.json from the live router and upload it as an artifact"
        type: choice
        options: [audit, record]
        default: audit

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/aisa-gtm/dify

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet -r ../../../.github/scripts/requirements.txt
      - name: Live contract audit (read-only, no credit spent)
        if: inputs.mode != 'record'
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
        run: python3 tests/contract_audit.py
      - name: Record a new baseline (read-only, no credit spent)
        if: inputs.mode == 'record'
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
        run: python3 tests/contract_audit.py --record
      - name: Upload the recorded baseline
        if: inputs.mode == 'record'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts_baseline
          path: plugins/aisa-gtm/dify/tests/contracts_baseline.json
          retention-days: 7
