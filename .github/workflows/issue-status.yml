name: issue status

# Keeps the `status:` labels honest so the open-issue list stays a live board:
#   - a PR that references an issue (Closes/Fixes/Resolves/Refs #n) moves it to `status: in-review`
#   - a PR closed without merging moves those issues back to `status: in-progress`
#   - a closed issue loses every `status:` label; a reopened work item gets `status: in-progress`
# pull_request_target is safe here: nothing from the PR is checked out or executed.

on:
  issues:
    types: [closed, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const STATUS = ["status: planned", "status: in-progress", "status: blocked", "status: in-review"];

            async function setStatus(issue_number, status) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request) return; // only issues carry status
              const names = issue.labels.map((l) => (typeof l === "string" ? l : l.name));
              for (const name of names) {
                if (STATUS.includes(name) && name !== status) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {});
                }
              }
              if (status && !names.includes(status)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [status] });
              }
              core.info(`#${issue_number} -> ${status || "(no status)"}`);
            }

            function referencedIssues(body) {
              const found = new Set();
              const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s*:?\s*#(\d+)/gi;
              for (const m of (body || "").matchAll(re)) found.add(Number(m[1]));
              return [...found];
            }

            if (context.eventName === "issues") {
              const issue = context.payload.issue;
              const names = issue.labels.map((l) => l.name);
              if (context.payload.action === "closed") {
                await setStatus(issue.number, null);
              } else if (context.payload.action === "reopened" && names.includes("type: work-item")) {
                await setStatus(issue.number, "status: in-progress");
              }
              return;
            }

            const pr = context.payload.pull_request;
            const issues = referencedIssues(pr.body);
            if (issues.length === 0) { core.info("PR references no issues"); return; }
            if (context.payload.action === "closed") {
              if (pr.merged) return; // GitHub closes the issues itself; the `closed` handler clears status
              for (const n of issues) await setStatus(n, "status: in-progress");
            } else if (!pr.draft) {
              for (const n of issues) await setStatus(n, "status: in-review");
            }
